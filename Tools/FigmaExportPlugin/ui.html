<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FestiCore Design Export</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font: 13px/1.5 Inter, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
    h1 { margin: 0 0 8px; font-size: 17px; }
    p { margin: 0 0 16px; color: var(--figma-color-text-secondary); }
    button { width: 100%; min-height: 36px; margin: 0 0 9px; padding: 7px 12px; border: 0; border-radius: 6px; color: var(--figma-color-text-onbrand); background: var(--figma-color-bg-brand); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    button.secondary { color: var(--figma-color-text); background: var(--figma-color-bg-secondary); }
    #status { min-height: 42px; margin: 12px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    #status.error { color: var(--figma-color-text-danger); }
    #result { display: none; }
    #preview { display: block; max-width: 100%; max-height: 130px; margin: 0 auto 12px; border: 1px solid var(--figma-color-border); object-fit: contain; }
    small { color: var(--figma-color-text-secondary); }
    section { border-top: 1px solid var(--figma-color-border); margin-top: 18px; padding-top: 14px; }
    h2 { margin: 0 0 7px; font-size: 14px; }
    textarea { width: 100%; height: 90px; resize: vertical; color: var(--figma-color-text); background: var(--figma-color-bg); border: 1px solid var(--figma-color-border); }
    #layout-report { white-space: pre-wrap; max-height: 120px; overflow: auto; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>FestiCore 디자인 추출</h1>
  <p>Figma에서 프레임 또는 섹션 하나를 선택하세요. 레이어 JSON과 이미지 채우기 원본, 미리보기 PNG를 로컬 파일로 저장합니다.</p>
  <button id="export">선택 영역 추출</button>
  <div id="status" role="status" aria-live="polite">프레임 또는 섹션을 선택한 뒤 추출을 누르세요.</div>
  <div id="result">
    <img id="preview" alt="선택 영역 미리보기">
    <button id="download-json">디자인 JSON 저장</button>
    <button id="download-png" class="secondary">미리보기 PNG 저장</button>
    <small>JSON에는 레이어 구조와 이미지 채우기 원본이 base64로 포함됩니다.</small>
  </div>
  <section>
    <h2>페이지 위치 맞추기</h2>
    <p>원본에서 위치 JSON을 저장한 뒤 편집 가능한 복제본의 같은 페이지에서 대조하세요. 부모 경로가 일치하는 프레임·섹션만 이동합니다.</p>
    <button id="layout-export" class="secondary">현재 페이지 위치 JSON 저장</button>
    <label for="layout-input">원본 위치 JSON 파일</label>
    <input id="layout-input" type="file" accept=".json,application/json">
    <button id="layout-preview" class="secondary">위치 대조</button>
    <div id="layout-report" role="status" aria-live="polite"></div>
    <button id="layout-apply" disabled>대조한 위치 적용</button>
  </section>
  <script>
    const exportButton = document.getElementById('export');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const preview = document.getElementById('preview');
    let prepared = null;
    let layoutInput = null;
    const layoutApply = document.getElementById('layout-apply');
    const layoutReport = document.getElementById('layout-report');

    exportButton.onclick = () => {
      prepared = null;
      preview.removeAttribute('src');
      result.style.display = 'none';
      status.className = '';
      status.textContent = '추출을 시작합니다…';
      exportButton.disabled = true;
      parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
    };

    onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message || typeof message.type !== 'string') return;
      if (message.type === 'progress') {
        status.textContent = message.text;
      } else if (message.type === 'error') {
        status.className = 'error';
        status.textContent = message.text;
        layoutReport.textContent = message.text;
        layoutApply.disabled = true;
        exportButton.disabled = false;
      } else if (message.type === 'ready') {
        prepared = message;
        status.textContent = `${message.name} (${message.nodeId})\n레이어 ${message.nodeCount}개 · 이미지 채우기 ${message.imageCount}개`;
        preview.src = `data:image/png;base64,${message.previewBase64}`;
        result.style.display = 'block';
        exportButton.disabled = false;
      } else if (message.type === 'layout-ready') {
        layoutReport.textContent = `${message.pageName}: ${message.count}개 위치를 읽었습니다.`;
        saveFile(new Blob([message.json], { type: 'application/json;charset=utf-8' }), 'festicore-page-layout.json');
      } else if (message.type === 'layout-report') {
        layoutApply.disabled = message.issues.length !== 0;
        layoutReport.textContent = message.issues.length
          ? `${message.issues.length}개 문제로 적용 중단:\n${message.issues.join('\n')}`
          : `${message.count}개 위치가 일치합니다. 적용할 수 있습니다.`;
      } else if (message.type === 'layout-applied') {
        layoutApply.disabled = true;
        layoutReport.textContent = `${message.count}개 위치를 적용했습니다.`;
      }
    };

    document.getElementById('download-json').onclick = () => {
      if (!prepared) return;
      saveFile(new Blob([prepared.json], { type: 'application/json;charset=utf-8' }), fileStem() + '.json');
    };

    document.getElementById('download-png').onclick = () => {
      if (!prepared) return;
      const binary = atob(prepared.previewBase64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      saveFile(new Blob([bytes], { type: 'image/png' }), fileStem() + '.png');
    };

    document.getElementById('layout-export').onclick = () => {
      layoutApply.disabled = true;
      layoutReport.textContent = '현재 페이지 위치를 읽는 중…';
      parent.postMessage({ pluginMessage: { type: 'layout-export' } }, '*');
    };

    document.getElementById('layout-input').onchange = async (event) => {
      layoutApply.disabled = true;
      layoutInput = null;
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 16 * 1024 * 1024) {
        layoutReport.textContent = '위치 JSON이 16 MB를 초과합니다.';
        return;
      }
      layoutInput = await file.text();
      layoutReport.textContent = `${file.name}을 읽었습니다. 위치 대조를 누르세요.`;
    };

    document.getElementById('layout-preview').onclick = () => {
      layoutApply.disabled = true;
      if (!layoutInput) {
        layoutReport.textContent = '원본 위치 JSON 파일을 선택하세요.';
        return;
      }
      layoutReport.textContent = '현재 페이지와 대조하는 중…';
      parent.postMessage({ pluginMessage: { type: 'layout-preview', json: layoutInput } }, '*');
    };

    layoutApply.onclick = () => {
      layoutApply.disabled = true;
      layoutReport.textContent = '위치를 적용하는 중…';
      parent.postMessage({ pluginMessage: { type: 'layout-apply' } }, '*');
    };

    function fileStem() {
      const name = prepared.name.replace(/[\\/:*?"<>|\x00-\x1f]/g, '_').slice(0, 64) || 'frame';
      return `${name}-${prepared.nodeId.replace(/[^a-zA-Z0-9-]/g, '-')}`;
    }

    function saveFile(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  </script>
</body>
</html>
