name: Develop Sharded Tests

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: develop-sharded-tests
  cancel-in-progress: true

env:
  TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
  XCODE_COMPILATION_CACHE_ENABLED: 'NO'
  TUIST_BUILD_TAGS: ci,develop,sharded
  TUIST_BUILD_VALUE_COMMIT: ${{ github.sha }}
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  build-shards:
    name: Build test shards
    runs-on: self-hosted
    timeout-minutes: 20

    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.build.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup iOS runner
        uses: ./.github/actions/setup-ios-runner
        with:
          tuist-token: ${{ secrets.TUIST_TOKEN }}
          derived-data-directory: FestiCore-develop-build

      - name: Restore Google service configuration
        uses: ./.github/actions/restore-google-service
        with:
          plist-base64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: Setup Tuist cache
        continue-on-error: true
        timeout-minutes: 3
        run: bash Scripts/setup-tuist-cache.sh

      # Build Insights가 빌드 중 CPU/메모리 같은 러너 메트릭도 함께 수집하게 한다.
      - name: Setup Tuist insights
        continue-on-error: true
        timeout-minutes: 3
        run: mise exec -- tuist setup insights

      - name: Install project dependencies
        run: mise exec -- tuist install

      - name: Select simulator
        run: |
          SIMULATOR_DESTINATION="$(python3 Scripts/select-ios-simulator.py --ci-duo)"
          echo "SIMULATOR_DESTINATION=$SIMULATOR_DESTINATION" >> "$GITHUB_ENV"

      - name: Prepare simulator
        run: ./Scripts/prepare-ios-simulator.sh

      - name: Prepare build DerivedData
        run: |
          # Tuist shard 빌드가 임시 폴더에 남기는 산출물은 원격 shard storage에 올라간 뒤 쓰지 않으므로 2시간 지난 것을 지운다.
          find "${TMPDIR:-/tmp}" -maxdepth 1 -name 'shard-test-products-*' -mmin +120 -exec rm -rf {} + 2>/dev/null || true
          mkdir -p "$CI_DERIVED_DATA"
          rm -rf \
            "$CI_DERIVED_DATA/Build" \
            "$CI_DERIVED_DATA/Index.noindex" \
            "$CI_DERIVED_DATA/Logs" \
            "$CI_DERIVED_DATA/SourcePackages" \
            "$CI_DERIVED_DATA/info.plist"

      # Stage scheme의 전체 테스트를 한 번 빌드하고 최근 30일 실행 시간으로 두 shard를 계획한다.
      # 커버리지를 함께 수집한다. 소스 경로 매핑을 켜면 xccov가 0/0을 기록하므로 끈다.
      - name: Build and plan shards
        id: build
        run: |
          mise exec -- tuist test run FestiCore-Stage \
            --build-only \
            --no-binary-cache \
            --test-plan FestiCore \
            --configuration Stage \
            --no-selective-testing \
            --skip-quarantine \
            --shard-total 2 \
            --shard-granularity module \
            --inspect-mode remote \
            --result-bundle-path ShardBuildResults.xcresult \
            -- \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$CI_DERIVED_DATA" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_PREFIX_MAPPING=NO \
            SWIFT_ENABLE_PROJECT_PREFIX_MAPPING=NO \
            CLANG_ENABLE_PREFIX_MAPPING=NO \
            CLANG_ENABLE_PROJECT_PREFIX_MAPPING=NO \
            ONLY_ACTIVE_ARCH=YES \
            COMPILATION_CACHE_ENABLE_CACHING="$XCODE_COMPILATION_CACHE_ENABLED"

      # 테스트 호스트에만 필요한 XCTest 주입 파일을 번들 크기 기준선에서 제외한다.
      - name: Remove test injector from bundle baseline
        run: |
          rm -f "$CI_DERIVED_DATA/Build/Products/Stage-iphonesimulator/FestiCore.app/Frameworks/libXCTestBundleInject.dylib"

      # develop 번들을 기준선으로 저장해 PR의 크기 증감과 threshold를 비교할 수 있게 한다.
      - name: Build app for bundle insights
        run: |
          mise exec -- tuist xcodebuild build \
            -workspace FestiCore.xcworkspace \
            -scheme FestiCore-Stage \
            -configuration Stage \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$CI_DERIVED_DATA" \
            -resultBundlePath BundleBuildResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            COMPILATION_CACHE_ENABLE_CACHING="$XCODE_COMPILATION_CACHE_ENABLED"

      - name: Inspect bundle size
        run: |
          mise exec -- tuist inspect bundle FestiCore \
            --platforms ios \
            --configuration Stage \
            --derived-data-path "$CI_DERIVED_DATA"

      - name: Shut down shard build simulator
        if: always()
        run: |
          SIMULATOR_UDID="${SIMULATOR_DESTINATION##*,id=}"
          if [[ -n "$SIMULATOR_UDID" && "${SIMULATOR_BOOTED_BY_JOB:-}" == "$SIMULATOR_UDID" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
          fi

      - name: Clean build DerivedData
        if: always()
        run: |
          bash Scripts/clean-ci-derived-data.sh FestiCore-develop-build
          rm -rf ShardBuildResults.xcresult BundleBuildResults.xcresult

  test-shards:
    name: Test shard ${{ matrix.shard }}
    needs: build-shards
    if: toJSON(fromJSON(needs.build-shards.outputs.matrix).shard) != '[]'
    runs-on: self-hosted
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-shards.outputs.matrix) }}

    env:
      TUIST_SHARD_INDEX: ${{ matrix.shard }}
      TUIST_SHARD_PLAN_ID: ${{ matrix.shard_plan_id }}
      RESULT_BUNDLE: TestResults-${{ matrix.shard }}.xcresult
      TEST_RUN_REPORT_PATH: TestRunReport-${{ matrix.shard }}.json
      TEST_LOG_PATH: TuistTestRun-${{ matrix.shard }}.log

    steps:
      - uses: actions/checkout@v4

      - name: Setup iOS runner
        uses: ./.github/actions/setup-ios-runner
        with:
          tuist-token: ${{ secrets.TUIST_TOKEN }}
          derived-data-directory: FestiCore-develop-shard-${{ matrix.shard }}

      - name: Restore Google service configuration
        uses: ./.github/actions/restore-google-service
        with:
          plist-base64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: Select simulator
        run: |
          SIMULATOR_DESTINATION="$(python3 Scripts/select-ios-simulator.py --ci-duo)"
          echo "SIMULATOR_DESTINATION=$SIMULATOR_DESTINATION" >> "$GITHUB_ENV"

      - name: Prepare simulator
        run: ./Scripts/prepare-ios-simulator.sh

      - name: Prepare shard DerivedData
        run: |
          mkdir -p "$CI_DERIVED_DATA"
          rm -rf \
            "$CI_DERIVED_DATA/Build" \
            "$CI_DERIVED_DATA/Index.noindex" \
            "$CI_DERIVED_DATA/Logs" \
            "$CI_DERIVED_DATA/SourcePackages" \
            "$CI_DERIVED_DATA/info.plist"

      # 빌드 단계가 업로드한 테스트 산출물을 받아 이 shard에 배정된 테스트만 실행한다.
      # 모든 테스트를 실행하고 Test Insights에 결과를 업로드한다.
      - name: Run shard
        run: ./Scripts/run-isolated-module-tests.sh

      - name: Upload test shard diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: develop-test-shard-${{ github.run_id }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            TestResults-${{ matrix.shard }}.xcresult
            TestRunReport-${{ matrix.shard }}.json
            TuistTestRun-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Shut down test shard simulator
        if: always()
        run: |
          SIMULATOR_UDID="${SIMULATOR_DESTINATION##*,id=}"
          if [[ -n "$SIMULATOR_UDID" && "${SIMULATOR_BOOTED_BY_JOB:-}" == "$SIMULATOR_UDID" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
          fi

      - name: Clean shard DerivedData
        if: always()
        run: bash Scripts/clean-ci-derived-data.sh "FestiCore-develop-shard-${{ matrix.shard }}"

  coverage-report:
    name: Test coverage report
    needs: [build-shards, test-shards]
    if: ${{ !cancelled() && needs.build-shards.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 10

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download test shard reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: develop-test-shard-${{ github.run_id }}-*
          path: Artifacts/tests

      # 결과는 실행 요약에 남기고, 이 커밋을 머지한 PR(없으면 커밋)에 커버리지 댓글을 단다.
      - name: Report coverage
        uses: actions/github-script@v7
        env:
          REPORT_COMMENT: 'true'
          RESULT_BUNDLE_DIR: Artifacts/tests
          COVERAGE_SHARD_IDS: ${{ join(fromJSON(needs.build-shards.outputs.matrix || '{"shard":[]}').shard, ',') }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TEST_OUTCOME: ${{ needs.test-shards.result == 'success' && 'success' || 'failure' }}
          TEST_RUN_REPORT_PATH: Artifacts/tests
        with:
          script: |
            const report = require(`${process.env.GITHUB_WORKSPACE}/Scripts/ios-test-report.js`)
            await report({ github, context, core })

  warm-module-cache:
    name: Warm Stage module cache
    needs: test-shards
    runs-on: self-hosted
    timeout-minutes: 20
    continue-on-error: true

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup iOS runner
        uses: ./.github/actions/setup-ios-runner
        with:
          tuist-token: ${{ secrets.TUIST_TOKEN }}
          derived-data-directory: FestiCore-develop-cache-warm

      - name: Install project dependencies
        run: |
          mise exec -- tuist install

      - name: Setup Tuist cache
        id: tuist-cache
        continue-on-error: true
        timeout-minutes: 3
        run: bash Scripts/setup-tuist-cache.sh

      # develop의 검증된 소스를 Stage 바이너리 캐시 생산자로 사용한다.
      # tuist cache는 workspace를 변경하므로 후속 빌드와 분리된 마지막 job에서 실행한다.
      - name: Warm module cache
        if: steps.tuist-cache.outputs.enabled == 'true'
        run: bash Scripts/warm-ci-module-cache.sh

      - name: Clean cache warm DerivedData
        if: always()
        run: bash Scripts/clean-ci-derived-data.sh FestiCore-develop-cache-warm
