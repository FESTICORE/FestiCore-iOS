name: Assign PR owner

on:
  pull_request:
    types: [opened, reopened, unassigned, synchronize]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign Roy-wonji
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/assignees" \
            -f 'assignees[]=Roy-wonji' --silent
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER" \
            --jq '.assignees[].login' | grep -Fxq Roy-wonji
