name: Sync design tokens

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: design-token-sync
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      tree_digest: ${{ steps.import.outputs.digest }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: develop
          persist-credentials: false

      - name: Resolve one public DesignSystem commit
        id: source
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/FESTICORE/FestiCore-DesignSystem.git refs/heads/main | cut -f1)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [[ -f Projects/UI/FestiCoreDesignKit/TokenSnapshot/.source-sha ]] &&
             [[ "$(cat Projects/UI/FestiCoreDesignKit/TokenSnapshot/.source-sha)" == "$SHA" ]]; then
            echo "Design tokens already match $SHA" >> "$GITHUB_STEP_SUMMARY"
            echo 'already_current=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and verify the pinned source
        if: steps.source.outputs.already_current != 'true'
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/FESTICORE/FestiCore-DesignSystem.git "$RUNNER_TEMP/festicore-design-tokens"
          git -C "$RUNNER_TEMP/festicore-design-tokens" checkout --detach '${{ steps.source.outputs.sha }}'
          test "$(git -C "$RUNNER_TEMP/festicore-design-tokens" rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
          mise install node@22.23.2
          cd "$RUNNER_TEMP/festicore-design-tokens"
          mise exec node@22.23.2 -- npm ci
          mise exec node@22.23.2 -- npm run check

      - name: Import pinned generated artifacts and source JSON
        id: import
        if: steps.source.outputs.already_current != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/design-token-staging"
          DIGEST="$(python3 Scripts/sync-design-tokens.py \
            --source "$RUNNER_TEMP/festicore-design-tokens" \
            --destination Projects/UI/FestiCoreDesignKit \
            --sha '${{ steps.source.outputs.sha }}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          MODULE=Projects/UI/FestiCoreDesignKit
          SNAPSHOT="$RUNNER_TEMP/design-token-staging/FestiCoreDesignKit"
          mkdir -p "$SNAPSHOT/Sources/Token/Color" "$SNAPSHOT/Sources/Token/Layout" "$SNAPSHOT/Sources/Token/Typography" "$SNAPSHOT/Tests/Resources" "$SNAPSHOT/TokenSnapshot"
          cp "$MODULE/Sources/Token/Color/FestiCoreSemanticColor.swift" "$MODULE/Sources/Token/Color/ShapeStyle+.swift" "$SNAPSHOT/Sources/Token/Color/"
          cp "$MODULE/Sources/Token/Layout/FestiCoreLayout.swift" "$SNAPSHOT/Sources/Token/Layout/"
          cp "$MODULE/Sources/Token/Typography/FestiCoreTypography.swift" "$SNAPSHOT/Sources/Token/Typography/"
          cp -R "$MODULE/Tests/Resources/Tokens" "$SNAPSHOT/Tests/Resources/Tokens"
          cp "$MODULE/TokenSnapshot/.source-sha" "$SNAPSHOT/TokenSnapshot/.source-sha"

      - name: Setup iOS runner
        if: steps.source.outputs.already_current != 'true'
        uses: ./.github/actions/setup-ios-runner
        with:
          tuist-token: ${{ secrets.TUIST_TOKEN }}
          derived-data-directory: FestiCore-design-token-sync

      - name: Restore Google service configuration
        if: steps.source.outputs.already_current != 'true'
        uses: ./.github/actions/restore-google-service
        with:
          plist-base64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: Generate and test full Stage plan with coverage
        if: steps.source.outputs.already_current != 'true'
        run: |
          set -euo pipefail
          mise exec -- tuist setup cache
          mise exec -- tuist install
          ./make generate --no-open
          SIMULATOR_DESTINATION="$(python3 Scripts/select-ios-simulator.py --ci-duo)"
          echo "SIMULATOR_DESTINATION=$SIMULATOR_DESTINATION" >> "$GITHUB_ENV"
          export SIMULATOR_DESTINATION
          ./Scripts/prepare-ios-simulator.sh
          xcodebuild test \
            -workspace FestiCore.xcworkspace \
            -scheme FestiCoreDesignKit \
            -configuration Stage \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$CI_DERIVED_DATA" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_PREFIX_MAPPING=NO \
            SWIFT_ENABLE_PROJECT_PREFIX_MAPPING=NO \
            CLANG_ENABLE_PREFIX_MAPPING=NO \
            CLANG_ENABLE_PROJECT_PREFIX_MAPPING=NO
          xcodebuild test \
            -workspace FestiCore.xcworkspace \
            -scheme FestiCore-Stage \
            -testPlan FestiCore \
            -configuration Stage \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$CI_DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/design-token-stage.xcresult" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_PREFIX_MAPPING=NO \
            SWIFT_ENABLE_PROJECT_PREFIX_MAPPING=NO \
            CLANG_ENABLE_PREFIX_MAPPING=NO \
            CLANG_ENABLE_PROJECT_PREFIX_MAPPING=NO
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/design-token-stage.xcresult" > "$RUNNER_TEMP/design-token-staging/test-summary.json"
          python3 - "$RUNNER_TEMP/design-token-staging/test-summary.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          assert result.get("totalTestCount", 0) > 0, "Stage plan ran no tests"
          assert result.get("failedTests", 0) == 0, "Stage plan has failing tests"
          PY
          xcrun xccov view --report --json "$RUNNER_TEMP/design-token-stage.xcresult" > "$RUNNER_TEMP/design-token-staging/coverage.json"
          python3 - "$RUNNER_TEMP/design-token-staging/coverage.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report.get("executableLines", 0) > 0, "Coverage contains no executable lines"
          PY

      - name: Shut down design token test simulator
        if: always()
        run: |
          SIMULATOR_UDID="${SIMULATOR_DESTINATION##*,id=}"
          if [[ -n "$SIMULATOR_UDID" && "${SIMULATOR_BOOTED_BY_JOB:-}" == "$SIMULATOR_UDID" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
          fi

      - name: Upload verified snapshot
        id: upload
        if: steps.source.outputs.already_current != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-design-tokens
          path: ${{ runner.temp }}/design-token-staging
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.tree_digest != ''
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      TREE_DIGEST: ${{ needs.verify.outputs.tree_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: develop

      - name: Download verified snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-design-tokens
          path: ${{ runner.temp }}/verified-design-tokens

      - name: Reject stale or changed source and artifact
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/FESTICORE/FestiCore-DesignSystem.git refs/heads/main | cut -f1)"
          test "$SHA" = "$SOURCE_SHA"
          DIGEST="$(python3 Scripts/sync-design-tokens.py \
            --verify-only \
            --destination "$RUNNER_TEMP/verified-design-tokens/FestiCoreDesignKit" \
            --sha "$SOURCE_SHA")"
          test "$DIGEST" = "$TREE_DIGEST"
          test -s "$RUNNER_TEMP/verified-design-tokens/test-summary.json"
          test -s "$RUNNER_TEMP/verified-design-tokens/coverage.json"

      - name: Reuse fixed branch and pull request
        run: |
          set -euo pipefail
          BRANCH=chore/design-tokens-sync
          git fetch origin develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)"
          CURRENT_SHA="$(cat Projects/UI/FestiCoreDesignKit/TokenSnapshot/.source-sha 2>/dev/null || true)"
          if [[ "$CURRENT_SHA" == "$SOURCE_SHA" ]]; then
            echo "Design token source is already on develop." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          REMOTE_HEAD="$(git ls-remote --heads origin "$BRANCH" | cut -f1)"
          git switch -C "$BRANCH"
          python3 - "$RUNNER_TEMP/verified-design-tokens/FestiCoreDesignKit" Projects/UI/FestiCoreDesignKit <<'PY'
          from pathlib import Path
          import shutil, sys
          source, target = map(Path, sys.argv[1:])
          if target.is_symlink():
              raise SystemExit("DesignKit destination is a symlink")
          def destination_for(relative):
              current = target
              for part in Path(relative).parts[:-1]:
                  current = current / part
                  if current.is_symlink():
                      raise SystemExit(f"Symlink destination: {current}")
              destination = target / relative
              if destination.is_symlink():
                  raise SystemExit(f"Symlink destination: {destination}")
              return destination
          sources = (
              "Sources/Token/Color/FestiCoreSemanticColor.swift",
              "Sources/Token/Color/ShapeStyle+.swift",
              "Sources/Token/Layout/FestiCoreLayout.swift",
              "Sources/Token/Typography/FestiCoreTypography.swift",
              "TokenSnapshot/.source-sha",
          )
          for name in sources:
              destination = destination_for(name)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source / name, destination)
          tokens = destination_for("Tests/Resources/Tokens")
          if tokens.exists():
              shutil.rmtree(tokens)
          shutil.copytree(source / "Tests/Resources/Tokens", tokens, symlinks=False)
          PY
          git add Projects/UI/FestiCoreDesignKit/Sources/Token/Color Projects/UI/FestiCoreDesignKit/Sources/Token/Layout Projects/UI/FestiCoreDesignKit/Sources/Token/Typography/FestiCoreTypography.swift Projects/UI/FestiCoreDesignKit/Tests/Resources/Tokens Projects/UI/FestiCoreDesignKit/TokenSnapshot/.source-sha
          if git diff --cached --quiet; then
            echo "No design token changes to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='FestiCore Bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: 디자인 토큰 스냅샷 갱신 #3'
          if [[ -z "$REMOTE_HEAD" ]]; then
            git push origin "HEAD:refs/heads/$BRANCH"
          else
            git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_HEAD" origin "HEAD:refs/heads/$BRANCH"
          fi
          NEW_HEAD="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='Design token sync verification' -f head_sha="$NEW_HEAD" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Generated snapshot verified' \
            -f "output[summary]=Stage tests and coverage passed before commit. Source: $SOURCE_SHA. Artifact digest: ${{ needs.verify.outputs.artifact_digest }}. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY="$(mktemp)"
          cat > "$BODY" <<EOF
          ## 디자인 토큰 동기화

          - 원본 커밋: $SOURCE_SHA
          - 스냅샷 SHA-256: $TREE_DIGEST
          - 검증 아티팩트 digest: ${{ needs.verify.outputs.artifact_digest }}
          - 검증: 디자인 모듈 테스트, 전체 Stage 테스트, 커버리지 확인
          - 실행: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Refs #3
          EOF
          NUMBER="$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$NUMBER" ]]; then
            gh pr create --base develop --head "$BRANCH" --title 'chore: 디자인 토큰 자동 동기화 #3' --body-file "$BODY"
          else
            gh pr edit "$NUMBER" --body-file "$BODY"
          fi

  report-verification-failure:
    needs: verify
    if: always() && needs.verify.result == 'failure'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: develop
      - name: Report failed source verification to the open sync PR
        run: |
          NUMBER="$(gh pr list --head chore/design-tokens-sync --base develop --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$NUMBER" ]]; then
            gh pr comment "$NUMBER" --body "디자인 토큰 검증이 실패했습니다. 원본 SHA: ${{ needs.verify.outputs.source_sha || '확인 전' }}. 실행: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
