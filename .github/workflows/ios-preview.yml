name: iOS Preview

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      provision_live_activity_profile:
        description: Live Activity 확장 서명 프로파일 발급
        type: boolean
        required: false
        default: false
      provision_widget_app_group:
        description: 앱·위젯 App Group 연결과 서명 프로파일 재발급 (빌드·배포 없음)
        type: boolean
        required: false
        default: false
      force_regenerate_profiles:
        description: Push 권한 변경 후 앱 및 확장 프로파일 강제 재발급
        type: boolean
        required: false
        default: false

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_COMPILATION_CACHE_ENABLED: 'NO'

jobs:
  share:
    if: ${{ github.event_name != 'workflow_dispatch' || !(inputs.provision_live_activity_profile || inputs.force_regenerate_profiles || inputs.provision_widget_app_group) }}
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      TUIST_BUILD_TAGS: ci,develop,preview
      TUIST_BUILD_VALUE_COMMIT: ${{ github.sha }}
      FESTICORE_SENTRY_DSN: ${{ secrets.FESTICORE_SENTRY_DSN }}
      FESTICORE_MIXPANEL_TOKEN: ${{ secrets.FESTICORE_MIXPANEL_TOKEN }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Setup iOS runner
        uses: ./.github/actions/setup-ios-runner
        with:
          tuist-token: ${{ secrets.TUIST_TOKEN }}
          derived-data-directory: FestiCore-preview
      - name: Restore Google service configuration
        uses: ./.github/actions/restore-google-service
        with:
          plist-base64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      - name: Verify Tuist authentication
        if: ${{ vars.TUIST_SERVER_ENABLED == 'true' }}
        run: test -n "$TUIST_TOKEN"
      - name: Setup Tuist cache
        if: ${{ vars.TUIST_SERVER_ENABLED == 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        run: bash Scripts/setup-tuist-cache.sh
      - name: Setup Tuist insights
        if: ${{ vars.TUIST_SERVER_ENABLED == 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        run: mise exec -- tuist setup insights
      - name: Resolve dependencies
        run: mise exec -- tuist install
      - name: Generate workspace
        run: mise exec -- tuist generate --no-open --cache-profile only-external
      - name: Build simulator app
        run: |
          mise exec -- tuist xcodebuild build \
            -workspace FestiCore.xcworkspace \
            -scheme FestiCore-Stage \
            -configuration Stage \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CI_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            FESTICORE_BUILD_NUMBER="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            FESTICORE_SENTRY_DSN="$FESTICORE_SENTRY_DSN" \
            ${FESTICORE_MIXPANEL_TOKEN:+"FESTICORE_MIXPANEL_TOKEN=$FESTICORE_MIXPANEL_TOKEN"} \
            COMPILATION_CACHE_ENABLE_CACHING="$XCODE_COMPILATION_CACHE_ENABLED"
      - name: Share private Tuist preview
        if: ${{ vars.TUIST_SERVER_ENABLED == 'true' }}
        run: |
          APP_PATH="$CI_DERIVED_DATA/Build/Products/Stage-iphonesimulator/FestiCore.app"
          test -d "$APP_PATH"
          BUNDLE_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP_PATH/Info.plist")
          if [[ "$BUNDLE_BUILD_NUMBER" != "$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" ]]; then
            echo "Preview 빌드 번호가 GitHub 실행 번호와 다릅니다: $BUNDLE_BUILD_NUMBER" >&2
            exit 1
          fi
          mise exec -- tuist share "$APP_PATH" --track nightly
      - name: Clean preview DerivedData
        if: always()
        run: bash Scripts/clean-ci-derived-data.sh FestiCore-preview

  provision-signing:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.provision_live_activity_profile || inputs.force_regenerate_profiles || inputs.provision_widget_app_group) }}
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
      MATCH_GIT_URL: git@github.com:Roy-wonji/FastlaneMatch.git
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup iOS runner
        uses: ./.github/actions/setup-ios-runner
        with:
          derived-data-directory: FestiCore-live-activity-signing
      - name: Install Fastlane dependencies
        run: bundle install
      - name: Provision widget App Group and profiles
        if: ${{ inputs.provision_widget_app_group }}
        run: bundle exec fastlane provision_widget_app_group
      - name: Provision Live Activity profiles
        if: ${{ !inputs.provision_widget_app_group }}
        run: bundle exec fastlane provision_live_activity_signing force:${{ inputs.force_regenerate_profiles }}
      - name: Clean signing DerivedData
        if: always()
        run: bash Scripts/clean-ci-derived-data.sh FestiCore-live-activity-signing
