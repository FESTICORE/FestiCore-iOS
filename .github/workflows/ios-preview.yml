name: iOS Preview

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      provision_live_activity_profile:
        description: Live Activity 확장 서명 프로파일 발급
        type: boolean
        required: false
        default: false

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  share:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.provision_live_activity_profile }}
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      TUIST_BUILD_TAGS: ci,develop,preview
      TUIST_BUILD_VALUE_COMMIT: ${{ github.sha }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Setup iOS runner
        uses: ./.github/actions/setup-ios-runner
        with:
          tuist-token: ${{ secrets.TUIST_TOKEN }}
          derived-data-directory: FestiCore-preview
      - name: Verify Tuist authentication
        run: test -n "$TUIST_TOKEN"
      - name: Setup Tuist cache
        id: tuist-cache
        continue-on-error: true
        timeout-minutes: 3
        run: mise exec -- tuist setup cache
      - name: Configure compilation cache fallback
        run: |
          if [[ "${{ steps.tuist-cache.outcome }}" == "success" ]]; then
            echo "XCODE_COMPILATION_CACHE_ENABLED=YES" >> "$GITHUB_ENV"
          else
            echo "XCODE_COMPILATION_CACHE_ENABLED=NO" >> "$GITHUB_ENV"
          fi
      - name: Setup Tuist insights
        continue-on-error: true
        timeout-minutes: 3
        run: mise exec -- tuist setup insights
      - name: Resolve dependencies
        run: mise exec -- tuist install
      - name: Generate workspace
        run: mise exec -- tuist generate --no-open --cache-profile only-external
      - name: Build simulator app
        run: |
          mise exec -- tuist xcodebuild build \
            -workspace FestiCore.xcworkspace \
            -scheme FestiCore-Stage \
            -configuration Stage \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/FestiCore-preview" \
            CODE_SIGNING_ALLOWED=NO \
            FESTICORE_BUILD_NUMBER="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            COMPILATION_CACHE_ENABLE_CACHING="$XCODE_COMPILATION_CACHE_ENABLED"
      - name: Share private Tuist preview
        run: |
          APP_PATH="$RUNNER_TEMP/FestiCore-preview/Build/Products/Stage-iphonesimulator/FestiCore.app"
          test -d "$APP_PATH"
          BUNDLE_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP_PATH/Info.plist")
          if [[ "$BUNDLE_BUILD_NUMBER" != "$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" ]]; then
            echo "Preview 빌드 번호가 GitHub 실행 번호와 다릅니다: $BUNDLE_BUILD_NUMBER" >&2
            exit 1
          fi
          mise exec -- tuist share "$APP_PATH" --track nightly

  provision-signing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.provision_live_activity_profile }}
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
      MATCH_GIT_URL: git@github.com:Roy-wonji/FastlaneMatch.git
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Homebrew PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Install Fastlane dependencies
        run: bundle install
      - name: Provision Live Activity profiles
        run: bundle exec fastlane provision_live_activity_signing
